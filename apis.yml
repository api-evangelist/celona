aid: celona
name: Celona
description: >-
  Celona provides enterprise private 5G and LTE cellular networking that connects
  where Wi-Fi cannot reach. The platform combines Celona Edge appliances, indoor and
  outdoor 5G Access Points, and the cloud-delivered Celona Orchestrator (CSO) for
  zero-touch provisioning, policy, and lifecycle management over CBRS and shared
  spectrum. Celona exposes a REST API surface through the Orchestrator for network
  monitoring, event querying, device experience, system status (Edge and Access Point
  CPU, memory, and uptime), and account audit logs, authenticated with an X-API-Key
  generated in the Orchestrator. It serves manufacturing, logistics, healthcare, higher
  education, oil and gas, and other industries needing mission-critical wireless.
